services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chemistry
      POSTGRES_PASSWORD: chemistry
      POSTGRES_DB: closest_chemistry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemistry -d closest_chemistry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://chemistry:chemistry@db:5432/closest_chemistry
      DATABASE_SSL_REQUIRE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/.local_storage
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://chemistry:chemistry@db:5432/closest_chemistry
      DATABASE_SSL_REQUIRE: "false"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - storage:/app/.local_storage
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - api

volumes:
  pgdata:
  storage:
